name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:        # tests (and a size-checked build) on PRs; push only on main
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: lugha_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql://postgres:pw@localhost:5432/lugha_test
        run: python -m pytest -q
      - name: End-to-end simulation
        run: python scripts/simulate.py

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: registry.africastalking.dev/zej2a1/lugha-verify:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker Image
        run: |
          echo "=== Building Docker Image ==="
          docker build -t "$IMAGE" .

      - name: Check image size (Marketplace limit 1 GB)
        run: |
          bytes=$(docker image inspect -f '{{.Size}}' "$IMAGE")
          echo "image size: $((bytes / 1000000)) MB"
          [ "$bytes" -lt 1000000000 ] || { echo "image is over 1 GB"; exit 1; }

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          echo "=== Pushing Docker Image ==="
          docker push "$IMAGE"
